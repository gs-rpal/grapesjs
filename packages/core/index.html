<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GrapesJS</title>
    <link rel="stylesheet" href="dist/css/grapes.min.css" />
    <script src="grapes.min.js"></script>
    <script src="https://devstaticjs.develgs.com/grapesjs/plugin/tinyrte.js"></script>
    <style>
      body,
      html {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <div class="container" style="width: 100%; height: 100%;">
      <div id="gjs" style="height: 0px; overflow: hidden;">
        <div class="panel">
          <h1>Welcome to</h1>
          <div>
            This is a demo content from index.html. For the development, you shouldn't edit this file, instead you can
            copy and rename it to _index.html, on next server start the new file will be served, and it will be ignored by
            git.
          </div>
          <div>
            Hello World
          </div>
        </div>
        <style>
          .panel {
            width: 90%;
            max-width: 700px;
            border-radius: 3px;
            padding: 30px 20px;
            margin: 150px auto 0px;
            background-color: #d983a6;
            box-shadow: 0px 3px 10px 0px rgba(0, 0, 0, 0.25);
            color: rgba(255, 255, 255, 0.75);
            font: caption;
            font-weight: 100;
          }

          .welcome {
            text-align: center;
            font-weight: 100;
            margin: 0px;
          }

          .logo {
            width: 70px;
            height: 70px;
            vertical-align: middle;
          }

          .logo path {
            pointer-events: none;
            fill: none;
            stroke-linecap: round;
            stroke-width: 7;
            stroke: #fff;
          }

          .big-title {
            text-align: center;
            font-size: 3.5rem;
            margin: 15px 0;
          }

          .description {
            text-align: justify;
            font-size: 1rem;
            line-height: 1.5rem;
          }
        </style>
      </div>
    </div>
    <script type="text/javascript">
      var editor = grapesjs.init({
        showOffsets: 1,
        noticeOnUnload: 0,
        container: '#gjs',
        height: '100%',
        fromElement: true,
        avoidInlineStyle: true,
        addInlineStyleToTextComponent: true,
        forceClass: false,
        storageManager: { autoload: 0 },
        styleManager: {
          sectors: [
            {
              name: 'General',
              open: false,
              buildProps: ['float', 'display', 'position', 'top', 'right', 'left', 'bottom'],
            },
            {
              name: 'Flex',
              open: false,
              buildProps: [
                'flex-direction',
                'flex-wrap',
                'justify-content',
                'align-items',
                'align-content',
                'order',
                'flex-basis',
                'flex-grow',
                'flex-shrink',
                'align-self',
              ],
            },
            {
              name: 'Dimension',
              open: false,
              buildProps: ['width', 'height', 'max-width', 'min-height', 'margin', 'padding'],
            },
            {
              name: 'Typography',
              open: false,
              buildProps: [
                'font-family',
                'font-size',
                'font-weight',
                'letter-spacing',
                'color',
                'line-height',
                'text-shadow',
              ],
            },
            {
              name: 'Decorations',
              open: false,
              buildProps: [
                'border-radius-c',
                'background-color',
                'border-radius',
                'border',
                'box-shadow',
                'background',
              ],
            },
            {
              name: 'Extra',
              open: false,
              buildProps: ['transition', 'perspective', 'transform'],
            },
          ],
        },
        plugins: [
        'grapesjs-parser-postcss',
        (window).StudioSdkPlugins_rteTinyMce.init({
          cdnScript: 'https://cdn.tiny.cloud/1/xtrcxjntxc8y3xmras8axrlvyb29tb5nhdi0ly86ywmwop30/tinymce/7/tinymce.min.js',
          enableOnClick: false,
          // Custom TinyMCE configuration
          loadConfig: ({ component, config }) => {
            const cmpAttr = component.getAttributes();
            // Check if the component has the unsubscribe attribute
            return {
                ...config,
                menubar: false,
                font_family_formats: 'Andale Mono=andale mono,times; Arial=arial,helvetica,sans-serif; Arial Black=arial black,avant garde;Brush Script MT=brush script mt, sans-serif; Lucida Sans Unicode=lucida sans unicode, lucida grande, sans-serif; Book Antiqua=book antiqua,palatino; Comic Sans MS=comic sans ms,sans-serif; Courier New=courier new,courier; Georgia=georgia,palatino; Helvetica=helvetica; Impact=impact,chicago; Symbol=symbol; Tahoma=tahoma,arial,helvetica,sans-serif; Terminal=terminal,monaco; Times New Roman=times new roman,times; Trebuchet MS=trebuchet ms,geneva; Verdana=verdana,geneva; Webdings=webdings; Wingdings=wingdings,zapf dingbats',
                font_size_formats: Array.from({ length: 64 - 8 + 1 }, (_, i) => (8 + i)+"px").join(' '),
                line_height_formats: '1 1.1 1.2 1.3 1.4 1.5 2 2.1 2.2 2.3 2.4 2.5 3',
                extended_valid_elements: "img[*],a[*],table[*],tr[*],td[*],th[*]", // WARNING: DO NOT ADD more valid elements here.
                formats: {
                  underline: { inline: 'u', exact: true, remove: 'all' }
                },
                statusbar: false,
                inline: true,
                forced_root_block: 'div',
                forced_root_block_attrs: {
                  style: 'line-height: inherit;'
                },
                fix_list_elements: true,
                valid_children: "-code[code],+h1[div],+h2[div],+h3[div],+h4[div],+h5[div],+h6[div],+span[div|font|b|strong|i|em|u|s|sub|sup|o:p]",
                default_font_stack: [ '-apple-system', 'Arial', 'Helvetica Neue', 'sans-serif' ],
                custom_ui_selector: '.toolbar-container',
                // This is need to prevent unwanted behaviors between grapesjs and tinyMCE view.
                convert_fonts_to_spans: true,
                // keep these URLs/hrefs intact
                convert_urls: false,
                // For example, when this option is set to true, an empty paragraph, <p></p>, is serialized to <p><br></p>
                pad_empty_with_br: true,
                // This is needed to prevent the trailing brs at the end of block elements.
                remove_trailing_brs: false,
                powerpaste_allow_local_images: true,
                plugins: 'lists emoticons powerpaste',
                toolbar: [
                  "ai-bot-button fontfamily fontsize forecolor backcolor bold italic underline header-options-button alignleft aligncenter alignright alignjustify indent outdent line-height-button numlist bullist strikethrough superscript subscript removeformat link-token token image-token video-token layout-token survey-token emoticons attachment-token | undo redo"
                ],
                setup: (rte) => {
                  // this.tinymcePlugin(editor, rte, opts.toolbarContainer);
                  rte.on('change', (e) => {
                    const comp = this.editor.getSelected();
                    console.log('change', e.node);
                    this.editor.changed = true;
                    // comp && comp.view.syncContent({force: true});
                  });
                },
                powerpaste_word_import: () => new Promise((resolve) => this.openPasteFormattingModal(resolve)),
                powerpaste_googledocs_import: () => new Promise((resolve) => this.openPasteFormattingModal(resolve)),
                powerpaste_html_import: () => new Promise((resolve) => this.openPasteFormattingModal(resolve))
              }
          }
        })
      ]
      });

      editor.BlockManager.add('testBlock', {
        label: 'Block',
        attributes: { class: 'gjs-fonts gjs-f-b1' },
        content: `<div style="padding-top:50px; padding-bottom:50px; text-align:center" data-gjs-type="eb-block">Test block</div>`,
      });

      editor.on('change:changesCount', (comp) => {
        console.log('changesCount', this.editor.changed);
        this.editor.changed = false;
      });
      editor.on('component:selected', (comp) => {
        console.log('component:selected', comp.ccid);
      });
    </script>
  </body>
</html>
